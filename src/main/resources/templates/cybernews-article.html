<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CyberMaster - CyberNews Article</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        .article-image {
            width: 100%;
            max-height: 340px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CyberMaster</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/live-global-threats}">Live Global Threats</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/cybernews}">CyberNews</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/software-vulnerability-scanner}">Software Vulnerability Scanner</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/risk-quiz}">Business Risk Quiz</a>
                </li>
            </ul>
        </div>

        <div class="d-flex">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <a class="btn btn-outline-light btn-sm mb-3" th:href="@{/cybernews}">Back to CyberNews</a>

    <h1 class="h3" th:text="${article.title}">Article Title</h1>

    <img class="article-image my-3" th:if="${article.imageUrl != null}" th:src="${article.imageUrl}" alt="Article image" />

    <div class="mb-4">
        <p th:each="p : ${article.summaryParagraphs}" th:text="${p}">Summary paragraph</p>
        <p class="text-secondary" th:if="${#lists.isEmpty(article.summaryParagraphs)}">
            Summary unavailable. Click below to read the full article.
        </p>
    </div>

    <a class="btn btn-primary"
       th:href="${article.sourceUrl}"
       target="_blank"
       rel="noopener">
        Click to read more
    </a>
</div>
</body>
</html>
