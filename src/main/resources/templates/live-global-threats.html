<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CyberMaster - Live Global Threats</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        #threat-map {
            width: 100%;
            height: 70vh;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CyberMaster</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/live-global-threats}">Live Global Threats</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cybernews}">CyberNews</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/software-vulnerability-scanner}">Software Vulnerability Scanner</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/risk-quiz}">Business Risk Quiz</a>
                </li>
            </ul>
        </div>

        <div class="d-flex align-items-center gap-3">
            <span class="text-light small" th:if="${currentUsername != null}" th:text="'Welcome ' + ${currentUsername}">Welcome, user</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1>Live Global Threats</h1>
    <p class="lead">Live threat map</p>
    <div id="threat-map" class="mt-3"></div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script>
    mapboxgl.accessToken = "pk.eyJ1IjoiZGVhbmMtMTkiLCJhIjoiY21saWR5dTR0MDF4YzNmczU5bGljamU4MCJ9.g1WWdLpEB4pKWQRvmG-uCg";
    const map = new mapboxgl.Map({
        container: "threat-map",
        style: "mapbox://styles/mapbox/dark-v11",
        center: [0, 20],
        zoom: 1.3
    });

    function toGeoJson(events) {
        return {
            type: "FeatureCollection",
            features: events.map((e) => ({
                type: "Feature",
                geometry: {
                    type: "Point",
                    coordinates: [e.lng, e.lat]
                },
                properties: {
                    ip: e.ip,
                    country: e.country,
                    score: e.score
                }
            }))
        };
    }

    async function loadThreatEvents() {
        try {
            const res = await fetch("/api/threat-events");
            const data = await res.json();
            const source = map.getSource("threat-events");
            if (source) {
                source.setData(toGeoJson(data));
            }
        } catch (e) {

        }
    }

    map.on("load", () => {
        map.addSource("threat-events", {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] }
        });
        map.addLayer({
            id: "threat-events",
            type: "circle",
            source: "threat-events",
            paint: {
                "circle-radius": 5,
                "circle-color": "#ff2d2d",
                "circle-opacity": 0.9,
                "circle-blur": 0.6
            }
        });
        map.addLayer({
            id: "threat-events-pulse",
            type: "circle",
            source: "threat-events",
            paint: {
                "circle-radius": 6,
                "circle-color": "#ff2d2d",
                "circle-opacity": 0.4,
                "circle-blur": 1.0
            }
        });
        loadThreatEvents();

        function animatePulse() {
            const t = (Date.now() % 2000) / 2000;
            const radius = 6 + t * 16;
            const opacity = 0.8 * (1 - t);
            map.setPaintProperty("threat-events-pulse", "circle-radius", radius);
            map.setPaintProperty("threat-events-pulse", "circle-opacity", opacity);
            requestAnimationFrame(animatePulse);
        }
        animatePulse();
    });

</script>
</body>
</html>
