<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CyberMaster - Live Global Threats</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        #threat-map {
            width: 100%;
            height: 70vh;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CyberMaster</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/live-global-threats}">Live Global Threats</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cybernews}">CyberNews</a>
                </li>
            </ul>
        </div>

        <div class="d-flex">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1>Live Global Threats</h1>
    <p class="lead">Live threat map</p>
    <div id="threat-map" class="mt-3"></div>

    <div class="row g-4 mt-4">
        <div class="col-12 col-md-6 col-xl-3">
            <h2 class="h5">Top Attackers</h2>
            <ul class="list-unstyled small text-secondary" id="top-attackers"></ul>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
            <h2 class="h5">Top Attacked</h2>
            <ul class="list-unstyled small text-secondary" id="top-attacked"></ul>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
            <h2 class="h5">Top Network Attack Vectors</h2>
            <ul class="list-unstyled small text-secondary" id="top-vectors"></ul>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
            <h2 class="h5">Top Application Violations</h2>
            <ul class="list-unstyled small text-secondary" id="top-app-violations"></ul>
        </div>
    </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script>
    mapboxgl.accessToken = "pk.eyJ1IjoiZGVhbmMtMTkiLCJhIjoiY21saWR5dTR0MDF4YzNmczU5bGljamU4MCJ9.g1WWdLpEB4pKWQRvmG-uCg";
    const map = new mapboxgl.Map({
        container: "threat-map",
        style: "mapbox://styles/mapbox/dark-v11",
        center: [0, 20],
        zoom: 1.3
    });

    function renderList(el, items) {
        el.innerHTML = "";
        items.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = `${item.label} ${item.value}`;
            el.appendChild(li);
        });
    }

    async function loadThreatStats() {
        try {
            const res = await fetch("/api/threat-stats");
            const data = await res.json();
            renderList(document.getElementById("top-attackers"), data.topAttackers || []);
            renderList(document.getElementById("top-attacked"), data.topAttacked || []);
            renderList(document.getElementById("top-vectors"), data.topNetworkVectors || []);
            renderList(document.getElementById("top-app-violations"), data.topAppViolations || []);
        } catch (e) {

        }
    }

    loadThreatStats();
    setInterval(loadThreatStats, 30000);
</script>
</body>
</html>
