<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CyberMaster - Dashboard</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CyberMaster</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/live-global-threats}">Live Global Threats</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cybernews}">CyberNews</a>
                </li>
            </ul>
        </div>

        <div class="d-flex">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1>Welcome to CyberMaster</h1>
    <p class="lead">You are successfully logged in.</p>

    <div class="card bg-secondary text-light mt-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Admin Controls</h2>

            <div class="position-relative" th:attr="data-is-admin=${isAdmin}">
                <div id="admin-controls-content">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-secondary small">User Management</span>
                        <button class="btn btn-sm btn-outline-light" id="refreshUsersBtn" type="button">Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Enabled</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminUsersTbody">
                                <tr>
                                    <td colspan="5" class="text-secondary">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="admin-controls-locked" th:if="${!isAdmin}"
                     class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
                     style="backdrop-filter: blur(2px); background: rgba(0,0,0,0.35);">
                    <div class="text-center">
                        <div class="fw-semibold">Admin Controls Locked</div>
                        <div class="text-secondary small">Admin role required</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const isAdmin = /*[[${isAdmin}]]*/ false;
    const lockedEl = document.getElementById("admin-controls-locked");
    const tbodyEl = document.getElementById("adminUsersTbody");
    const refreshBtn = document.getElementById("refreshUsersBtn");

    function renderRows(users) {
        tbodyEl.innerHTML = "";
        if (!users.length) {
            const tr = document.createElement("tr");
            tr.innerHTML = '<td colspan="5" class="text-secondary">No users found.</td>';
            tbodyEl.appendChild(tr);
            return;
        }
        users.forEach((u) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${u.username}</td>
                <td>${u.email}</td>
                <td>${u.role}</td>
                <td>${u.enabled ? "Yes" : "No"}</td>
                <td>
                    <button class="btn btn-sm btn-outline-light" data-id="${u.id}" data-enabled="${u.enabled}">
                        ${u.enabled ? "Disable" : "Enable"}
                    </button>
                </td>
            `;
            tbodyEl.appendChild(tr);
        });
    }

    async function loadUsers() {
        if (!isAdmin) return;
        try {
            const res = await fetch("/api/admin/users");
            if (!res.ok) throw new Error("Failed");
            const data = await res.json();
            renderRows(data);
        } catch {
            tbodyEl.innerHTML = '<tr><td colspan="5" class="text-danger">Failed to load users.</td></tr>';
        }
    }

    async function toggleUser(id, enabled) {
        try {
            const res = await fetch(`/api/admin/users/${id}/enabled`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ enabled: !enabled })
            });
            if (!res.ok) throw new Error("Failed");
            loadUsers();
        } catch {
            alert("Failed to update user.");
        }
    }

    tbodyEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (!btn || !isAdmin) return;
        const id = btn.getAttribute("data-id");
        const enabled = btn.getAttribute("data-enabled") === "true";
        toggleUser(id, enabled);
    });

    refreshBtn.addEventListener("click", () => loadUsers());

    if (!isAdmin) {
        tbodyEl.innerHTML = '<tr><td colspan="5" class="text-secondary">Admin access required.</td></tr>';
    } else {
        loadUsers();
    }
</script>
</body>
</html>
