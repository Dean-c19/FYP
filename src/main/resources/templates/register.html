<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CyberMaster - Register</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="bg-dark text-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 shadow" style="min-width: 450px;">
        <h2 class="text-center mb-3">Create CyberMaster Account</h2>

        <div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" type="text" th:field="*{username}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control">
            </div>

            <button type="submit" class="btn btn-success w-100">Sign Up</button>
        </form>

        <p class="mt-3 text-center">
            Already a CyberMaster?
            <a th:href="@{/login}">Login here</a>
        </p>
    </div>
</div>
</body>
</html>
