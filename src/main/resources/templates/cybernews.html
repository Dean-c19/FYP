<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CyberMaster - CyberNews</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CyberMaster</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/live-global-threats}">Live Global Threats</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/cybernews}">CyberNews</a>
                </li>
            </ul>
        </div>

        <div class="d-flex">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row g-4">
        <div class="col-12 col-lg-7">
            <h1>CyberNews</h1>
            <p class="lead">Latest articles from The Hacker News.</p>
            <p class="text-secondary small">Click an article to read a summary of the news!</p>

            <style>
                .news-thumb {
                    width: 72px;
                    height: 72px;
                    object-fit: cover;
                    border-radius: 8px;
                }
            </style>

            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action bg-dark text-light border-secondary"
                   th:each="item : ${cyberNewsItems}"
                   th:href="@{/cybernews/article(url=${item.link})}">
                    <div class="d-flex gap-3 align-items-center">
                        <img class="news-thumb" th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" alt="Article image" />
                        <div class="flex-grow-1">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1" th:text="${item.title}">Article title</h5>
                                <small class="text-secondary"
                                       th:text="${item.publishedAt != null} ? ${#dates.format(item.publishedAt, 'MMM dd, yyyy')} : ''">
                                    Jan 01, 2025
                                </small>
                            </div>
                        </div>
                        <span class="btn btn-sm btn-outline-light">Read</span>
                    </div>
                </a>

                <div class="text-secondary mt-3" th:if="${#lists.isEmpty(cyberNewsItems)}">
                    No articles available right now.
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="p-4 bg-secondary rounded">
                <h2 class="h4">Right Side</h2>
                <p class="mb-0">for a different feature</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
